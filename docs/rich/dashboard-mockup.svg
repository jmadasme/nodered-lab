<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mockup de dashboard Node-RED</title>
  <desc id="desc">Vista estilizada de un dashboard con tarjetas KPI, medidor, gráfico de línea, interruptor, slider y tabla de sensores.</desc>
  <defs>
    <style>
      .bg { fill: #06141b; }
      .window { fill: #0b2029; stroke: #2A9D8F; stroke-width: 1.5; }
      .topbar { fill: #0e2733; }
      .sidebar { fill: #0a1d26; }
      .card { fill: #0e2733; stroke: #1d3b47; stroke-width: 1; }
      .card-accent { fill: #0e2733; stroke: #2A9D8F; stroke-width: 1.2; }
      .text { fill: #E8F0F2; font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .muted { fill: #A9BEC6; font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .accent { fill: #2A9D8F; }
      .blue { fill: #457B9D; }
      .steel { fill: #5B7C99; }
      .h1 { font-size: 26px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 650; }
      .body { font-size: 12.5px; }
      .small { font-size: 10.5px; }
      .kpi { font-size: 30px; font-weight: 700; }
      .tiny { font-size: 9.5px; letter-spacing: 1.2px; }
      .grid { stroke: #1d3b47; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <!-- Ventana -->
  <rect x="40" y="44" width="1120" height="672" rx="16" class="window"/>
  <path d="M 40 60 Q 40 44 56 44 L 1144 44 Q 1160 44 1160 60 L 1160 96 L 40 96 Z" class="topbar"/>
  <circle cx="70" cy="70" r="6" fill="#5B7C99"/>
  <circle cx="90" cy="70" r="6" fill="#457B9D"/>
  <circle cx="110" cy="70" r="6" fill="#2A9D8F"/>
  <rect x="150" y="56" width="560" height="28" rx="14" fill="#06141b" stroke="#1d3b47"/>
  <text x="170" y="75" class="muted small">http://localhost:1880/ui</text>
  <text x="1128" y="75" text-anchor="end" class="muted tiny">NODE-RED DASHBOARD 3.6.6</text>

  <!-- Sidebar -->
  <rect x="56" y="112" width="182" height="584" rx="10" class="sidebar"/>
  <text x="76" y="144" class="muted tiny">PESTAÑAS</text>

  <rect x="68" y="162" width="158" height="38" rx="8" fill="#112f3c" stroke="#2A9D8F"/>
  <circle cx="90" cy="181" r="5" class="accent"/>
  <text x="106" y="186" class="text body">Sensores</text>

  <circle cx="90" cy="228" r="5" class="steel"/>
  <text x="106" y="233" class="muted body">Inicio</text>
  <circle cx="90" cy="266" r="5" class="steel"/>
  <text x="106" y="271" class="muted body">Control</text>
  <circle cx="90" cy="304" r="5" class="steel"/>
  <text x="106" y="309" class="muted body">IoT</text>
  <circle cx="90" cy="342" r="5" class="steel"/>
  <text x="106" y="347" class="muted body">Monitor</text>

  <line x1="76" y1="382" x2="218" y2="382" stroke="#1d3b47"/>
  <text x="76" y="408" class="muted tiny">ESTADO</text>
  <circle cx="88" cy="432" r="4" class="accent"/>
  <text x="102" y="436" class="muted small">Broker conectado</text>
  <circle cx="88" cy="456" r="4" class="blue"/>
  <text x="102" y="460" class="muted small">Deploy activo</text>
  <circle cx="88" cy="480" r="4" class="steel"/>
  <text x="102" y="484" class="muted small">GPIO disponible</text>

  <rect x="68" y="626" width="158" height="52" rx="8" fill="#0e2733" stroke="#1d3b47"/>
  <text x="84" y="648" class="muted small">Datos simulados</text>
  <text x="84" y="666" class="steel small">laboratorio · 2026</text>

  <!-- Encabezado principal -->
  <text x="262" y="142" class="text h1">Panel de sensores</text>
  <text x="262" y="164" class="muted small">Actualizado hace 2 s · flujo de ejemplo</text>
  <rect x="1034" y="122" width="120" height="30" rx="15" fill="#123a3d" stroke="#2A9D8F"/>
  <text x="1094" y="142" text-anchor="middle" class="muted small">EN LÍNEA</text>

  <!-- KPIs -->
  <rect x="262" y="184" width="274" height="94" rx="10" class="card"/>
  <text x="280" y="210" class="muted small">TEMPERATURA</text>
  <text x="280" y="250" class="text kpi">23.5 °C</text>
  <text x="518" y="210" text-anchor="end" class="accent small">+0.8</text>
  <line x1="280" y1="262" x2="518" y2="262" stroke="#2A9D8F" stroke-width="2" opacity="0.55"/>

  <rect x="552" y="184" width="274" height="94" rx="10" class="card"/>
  <text x="570" y="210" class="muted small">HUMEDAD</text>
  <text x="570" y="250" class="text kpi">58 %</text>
  <text x="808" y="210" text-anchor="end" class="accent small">+2.1</text>
  <line x1="570" y1="262" x2="808" y2="262" stroke="#2A9D8F" stroke-width="2" opacity="0.55"/>

  <rect x="842" y="184" width="312" height="94" rx="10" class="card"/>
  <text x="860" y="210" class="muted small">PRESIÓN</text>
  <text x="860" y="250" class="text kpi">1013 hPa</text>
  <text x="1136" y="210" text-anchor="end" class="steel small">estable</text>
  <line x1="860" y1="262" x2="1136" y2="262" stroke="#457B9D" stroke-width="2" opacity="0.55"/>

  <!-- Gauge -->
  <rect x="262" y="296" width="380" height="210" rx="10" class="card-accent"/>
  <text x="280" y="322" class="text h2">Humedad relativa</text>
  <text x="624" y="322" text-anchor="end" class="muted small">Gauge · 0–100 %</text>
  <path d="M 350 430 A 110 110 0 0 1 570 430" fill="none" stroke="#1d3b47" stroke-width="22" stroke-linecap="round"/>
  <path d="M 350 430 A 110 110 0 0 1 519 337" fill="none" stroke="#2A9D8F" stroke-width="22" stroke-linecap="round"/>
  <line x1="460" y1="430" x2="519" y2="337" stroke="#E8F0F2" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="460" cy="430" r="9" fill="#06141b" stroke="#E8F0F2" stroke-width="3"/>
  <text x="460" y="472" text-anchor="middle" class="text" font-size="32" font-weight="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">58 %</text>
  <text x="460" y="492" text-anchor="middle" class="muted small">valor actual</text>
  <text x="350" y="470" class="steel tiny">0</text>
  <text x="570" y="470" text-anchor="end" class="steel tiny">100</text>

  <!-- Gráfico -->
  <rect x="658" y="296" width="496" height="210" rx="10" class="card"/>
  <text x="676" y="322" class="text h2">Temperatura · últimas 12 muestras</text>
  <text x="1136" y="322" text-anchor="end" class="muted small">°C</text>

  <line x1="690" y1="350" x2="1116" y2="350" class="grid"/>
  <line x1="690" y1="386" x2="1116" y2="386" class="grid"/>
  <line x1="690" y1="422" x2="1116" y2="422" class="grid"/>
  <line x1="690" y1="458" x2="1116" y2="458" class="grid"/>

  <path d="M 690 424 L 727 402 L 764 412 L 801 372 L 838 382 L 875 342 L 912 358 L 949 322 L 986 338 L 1023 302 L 1060 318 L 1097 292 L 1116 298 L 1116 458 L 690 458 Z" fill="#2A9D8F" opacity="0.12"/>
  <path d="M 690 424 L 727 402 L 764 412 L 801 372 L 838 382 L 875 342 L 912 358 L 949 322 L 986 338 L 1023 302 L 1060 318 L 1097 292 L 1116 298" fill="none" stroke="#2A9D8F" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1097" cy="292" r="4.5" fill="#06141b" stroke="#2A9D8F" stroke-width="2.5"/>

  <text x="690" y="478" class="steel tiny">-12</text>
  <text x="806" y="478" class="steel tiny">-8</text>
  <text x="922" y="478" class="steel tiny">-4</text>
  <text x="1116" y="478" text-anchor="end" class="steel tiny">ahora</text>

  <!-- Controles -->
  <rect x="262" y="522" width="380" height="154" rx="10" class="card"/>
  <text x="280" y="548" class="text h2">Control</text>
  <text x="624" y="548" text-anchor="end" class="muted small">GPIO · Raspberry Pi</text>

  <text x="280" y="580" class="muted small">Alarma activa</text>
  <text x="280" y="597" class="steel small">Pulsador GPIO18</text>
  <rect x="560" y="568" width="56" height="28" rx="14" fill="#2A9D8F"/>
  <circle cx="602" cy="582" r="10" fill="#E8F0F2"/>

  <text x="280" y="628" class="muted small">Brillo LED</text>
  <text x="280" y="645" class="steel small">GPIO12 · PWM 100 Hz</text>
  <line x1="440" y1="632" x2="616" y2="632" stroke="#1d3b47" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="632" x2="548" y2="632" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="548" cy="632" r="8" fill="#E8F0F2" stroke="#06141b" stroke-width="2"/>
  <text x="616" y="662" text-anchor="end" class="muted small">62 %</text>

  <!-- Tabla -->
  <rect x="658" y="522" width="496" height="154" rx="10" class="card"/>
  <text x="676" y="548" class="text h2">Últimas lecturas</text>
  <text x="1136" y="548" text-anchor="end" class="muted small">tabla</text>

  <text x="676" y="576" class="steel tiny">SENSOR</text>
  <text x="900" y="576" class="steel tiny">VALOR</text>
  <text x="1080" y="576" class="steel tiny">ESTADO</text>
  <line x1="676" y1="586" x2="1136" y2="586" stroke="#1d3b47"/>

  <text x="676" y="608" class="muted small">Temperatura</text>
  <text x="900" y="608" class="text small">23.5 °C</text>
  <rect x="1064" y="596" width="66" height="20" rx="10" fill="#123a3d" stroke="#2A9D8F"/>
  <text x="1097" y="610" text-anchor="middle" class="accent small">OK</text>

  <text x="676" y="634" class="muted small">Humedad</text>
  <text x="900" y="634" class="text small">58 %</text>
  <rect x="1064" y="622" width="66" height="20" rx="10" fill="#123a3d" stroke="#2A9D8F"/>
  <text x="1097" y="636" text-anchor="middle" class="accent small">OK</text>

  <text x="676" y="660" class="muted small">Presión</text>
  <text x="900" y="660" class="text small">1013 hPa</text>
  <rect x="1064" y="648" width="66" height="20" rx="10" fill="#112f3c" stroke="#457B9D"/>
  <text x="1097" y="662" text-anchor="middle" class="muted small">INFO</text>

  <text x="40" y="744" class="muted small">Mockup conceptual: no reproduce píxel a píxel el dashboard real. Los valores son simulados.</text>
  <text x="1160" y="744" text-anchor="end" class="muted small">docs/assets/dashboard-mockup.svg</text>
</svg>
