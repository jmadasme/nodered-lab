<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de ejecución de Node-RED Lab</title>
  <desc id="desc">Diagrama de entradas, motor de flujos Node-RED y salidas hacia dashboard, MQTT, PostgreSQL, correo y archivos.</desc>
  <defs>
    <style>
      .bg { fill: #06141b; }
      .panel { fill: #0b2029; stroke: #2A9D8F; stroke-width: 1.4; }
      .panel-soft { fill: #0e2733; stroke: #5B7C99; stroke-width: 1.2; }
      .card { fill: #112f3c; stroke: #457B9D; stroke-width: 1.1; }
      .card-teal { fill: #123a3d; stroke: #2A9D8F; stroke-width: 1.2; }
      .text { fill: #E8F0F2; font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .muted { fill: #A9BEC6; font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .accent { fill: #2A9D8F; }
      .blue { fill: #457B9D; }
      .steel { fill: #5B7C99; }
      .line { stroke: #5B7C99; stroke-width: 2; fill: none; }
      .line-teal { stroke: #2A9D8F; stroke-width: 2.2; fill: none; }
      .dash { stroke: #457B9D; stroke-width: 1.3; stroke-dasharray: 5 5; fill: none; }
      .label { font-size: 12px; letter-spacing: 1.4px; }
      .h1 { font-size: 31px; font-weight: 700; }
      .h2 { font-size: 16px; font-weight: 650; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>

  <rect x="52" y="36" width="8" height="8" rx="1" fill="#2A9D8F"/>
  <text x="70" y="46" class="muted label">NODERED-LAB / ARQUITECTURA</text>
  <text x="52" y="86" class="text h1">Del mensaje al mundo físico, y de vuelta</text>
  <text x="52" y="112" class="muted body">Editor en el navegador + runtime Node.js. Los flujos se guardan como JSON y se despliegan en caliente.</text>
  <line x1="52" y1="132" x2="1148" y2="132" stroke="#1d3b47" stroke-width="1"/>

  <!-- Entradas -->
  <rect x="52" y="160" width="230" height="420" rx="14" class="panel"/>
  <text x="70" y="190" class="text h2">Entradas</text>
  <text x="70" y="208" class="muted small">Eventos y datos</text>

  <rect x="68" y="226" width="198" height="56" rx="9" class="card"/>
  <circle cx="88" cy="254" r="7" class="accent"/>
  <text x="106" y="250" class="text body">Inject</text>
  <text x="106" y="267" class="muted small">manual · intervalo · cron</text>

  <rect x="68" y="292" width="198" height="56" rx="9" class="card"/>
  <circle cx="88" cy="320" r="7" class="blue"/>
  <text x="106" y="316" class="text body">HTTP / API</text>
  <text x="106" y="333" class="muted small">http in · http request</text>

  <rect x="68" y="358" width="198" height="56" rx="9" class="card"/>
  <circle cx="88" cy="386" r="7" class="accent"/>
  <text x="106" y="382" class="text body">MQTT</text>
  <text x="106" y="399" class="muted small">broker · topics · QoS</text>

  <rect x="68" y="424" width="198" height="56" rx="9" class="card"/>
  <circle cx="88" cy="452" r="7" class="steel"/>
  <text x="106" y="448" class="text body">GPIO / Raspberry Pi</text>
  <text x="106" y="465" class="muted small">digital · PWM · pulsador</text>

  <rect x="68" y="490" width="198" height="56" rx="9" class="card"/>
  <circle cx="88" cy="518" r="7" class="blue"/>
  <text x="106" y="514" class="text body">TCP · UDP · WebSocket</text>
  <text x="106" y="531" class="muted small">puertos y sockets</text>

  <!-- Centro -->
  <rect x="310" y="160" width="580" height="420" rx="14" class="panel"/>
  <text x="330" y="190" class="text h2">Runtime Node-RED</text>
  <text x="330" y="208" class="muted small">Una máquina de mensajes asíncrona, orientada a eventos</text>

  <rect x="330" y="226" width="250" height="132" rx="10" class="panel-soft"/>
  <text x="346" y="250" class="text body" font-weight="650">Editor (navegador)</text>
  <text x="346" y="271" class="muted small">Paleta de nodos</text>
  <text x="346" y="289" class="muted small">Lienzo y cables</text>
  <text x="346" y="307" class="muted small">Panel de importación</text>
  <text x="346" y="325" class="muted small">Pestañas de flujo</text>
  <text x="346" y="343" class="muted small">Depuración y estado</text>

  <rect x="620" y="226" width="250" height="132" rx="10" class="panel-soft"/>
  <text x="636" y="250" class="text body" font-weight="650">Runtime (Node.js)</text>
  <text x="636" y="271" class="muted small">Carga flows.json</text>
  <text x="636" y="289" class="muted small">Instancia los nodos</text>
  <text x="636" y="307" class="muted small">Enruta msg.*</text>
  <text x="636" y="325" class="muted small">Expone HTTP :1880</text>
  <text x="636" y="343" class="muted small">Ejecuta contexto</text>

  <line x1="580" y1="292" x2="620" y2="292" class="line-teal" marker-end="url(#arrow)"/>
  <line x1="620" y1="312" x2="580" y2="312" class="line" marker-end="url(#arrow-blue)"/>
  <text x="586" y="282" class="muted small">deploy</text>

  <rect x="330" y="382" width="540" height="78" rx="10" class="card-teal"/>
  <text x="348" y="408" class="text body" font-weight="650">Motor de mensajes</text>
  <text x="348" y="429" class="muted small">Cada nodo recibe un objeto msg, lo transforma y lo entrega al siguiente nodo.</text>
  <text x="348" y="447" class="muted small">msg.payload · msg.topic · msg.headers · msg.parts · msg.req / msg.res</text>

  <rect x="330" y="478" width="250" height="76" rx="10" class="panel-soft"/>
  <text x="346" y="502" class="text body" font-weight="650">Contexto</text>
  <text x="346" y="521" class="muted small">context · flow · global</text>
  <text x="346" y="539" class="muted small">Estado en memoria o persistente</text>

  <rect x="620" y="478" width="250" height="76" rx="10" class="panel-soft"/>
  <text x="636" y="502" class="text body" font-weight="650">Paleta instalada</text>
  <text x="636" y="521" class="muted small">dashboard 3.6.6</text>
  <text x="636" y="539" class="muted small">pi-gpio · email · postgresql</text>

  <!-- Salidas -->
  <rect x="918" y="160" width="230" height="420" rx="14" class="panel"/>
  <text x="936" y="190" class="text h2">Salidas</text>
  <text x="936" y="208" class="muted small">Acciones y visualización</text>

  <rect x="934" y="226" width="198" height="56" rx="9" class="card"/>
  <circle cx="954" cy="254" r="7" class="accent"/>
  <text x="972" y="250" class="text body">Dashboard</text>
  <text x="972" y="267" class="muted small">ui_tab · ui_group · widgets</text>

  <rect x="934" y="292" width="198" height="56" rx="9" class="card"/>
  <circle cx="954" cy="320" r="7" class="accent"/>
  <text x="972" y="316" class="text body">MQTT</text>
  <text x="972" y="333" class="muted small">publicar · QoS · retain</text>

  <rect x="934" y="358" width="198" height="56" rx="9" class="card"/>
  <circle cx="954" cy="386" r="7" class="blue"/>
  <text x="972" y="382" class="text body">PostgreSQL</text>
  <text x="972" y="399" class="muted small">insert · select · delete</text>

  <rect x="934" y="424" width="198" height="56" rx="9" class="card"/>
  <circle cx="954" cy="452" r="7" class="steel"/>
  <text x="972" y="448" class="text body">Correo</text>
  <text x="972" y="465" class="muted small">SMTP · TLS · alertas</text>

  <rect x="934" y="490" width="198" height="56" rx="9" class="card"/>
  <circle cx="954" cy="518" r="7" class="blue"/>
  <text x="972" y="514" class="text body">Archivos y APIs</text>
  <text x="972" y="531" class="muted small">file · exec · http response</text>

  <!-- Flujo entre columnas -->
  <line x1="282" y1="330" x2="306" y2="330" class="line-teal" marker-end="url(#arrow)"/>
  <line x1="282" y1="452" x2="306" y2="452" class="line-teal" marker-end="url(#arrow)"/>
  <line x1="890" y1="330" x2="914" y2="330" class="line-teal" marker-end="url(#arrow)"/>
  <line x1="890" y1="452" x2="914" y2="452" class="line-teal" marker-end="url(#arrow)"/>
  <text x="288" y="320" class="muted small">msg</text>
  <text x="890" y="320" class="muted small">msg</text>

  <!-- Leyenda -->
  <rect x="52" y="610" width="1096" height="62" rx="10" fill="#0b2029" stroke="#1d3b47" stroke-width="1"/>
  <circle cx="76" cy="641" r="6" class="accent"/>
  <text x="90" y="645" class="muted small">Entrada / salida principal</text>
  <circle cx="276" cy="641" r="6" class="blue"/>
  <text x="290" y="645" class="muted small">Integración de red</text>
  <circle cx="436" cy="641" r="6" class="steel"/>
  <text x="450" y="645" class="muted small">Hardware / servicios</text>
  <line x1="620" y1="641" x2="664" y2="641" class="line-teal" marker-end="url(#arrow)"/>
  <text x="674" y="645" class="muted small">Dirección del mensaje</text>
  <text x="866" y="645" class="muted small">82 archivos · 71 importables de forma estricta</text>

  <text x="52" y="700" class="muted small">Flujos de laboratorio. Algunos requieren ajustar broker, pines, rutas o credenciales antes de ejecutarse.</text>
  <text x="1148" y="700" text-anchor="end" class="muted small">docs/assets/arquitectura-nodered.svg</text>
</svg>
